name: Frontend refinement verification
on:
  push:
    branches: ['maintenance/frontend-20260920']
permissions:
  contents: read
concurrency:
  group: frontend-20260920
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply reviewed frontend changes
        run: |
          git merge-base --is-ancestor 1cf6a7281301b47a3b68df5eff9928df87b42d15 HEAD
          for file in .maintenance/frontend/0*.py; do python "$file"; done
          python .maintenance/frontend/check.py
      - run: npm ci --ignore-scripts --no-audit
      - run: node scripts/engine-stamp.cjs --check
      - run: npm run verify
      - name: Compile warehouse and validate unchanged assertion graph
        run: |
          npm install --prefix tooling --ignore-scripts --no-audit
          mkdir -p verification
          tooling/node_modules/.bin/dataform compile warehouse --json > verification/dataform-graph.json
          node scripts/check-dataform-graph.cjs verification/dataform-graph.json
      - name: Desktop and mobile browser checks
        run: |
          tooling/node_modules/.bin/playwright install --with-deps chromium
          node tooling/browser/smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-verification-${{ github.sha }}
          path: verification/
          retention-days: 7
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: verified-frontend-patch
          path: candidate/
          retention-days: 7
          if-no-files-found: error
  prepare-commit:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '1cf6a7281301b47a3b68df5eff9928df87b42d15'
      - uses: actions/download-artifact@v4
        with:
          name: verified-frontend-patch
          path: candidate
      - name: Commit the verified frontend without changing main
        run: |
          test "$(git rev-parse HEAD)" = '1cf6a7281301b47a3b68df5eff9928df87b42d15'
          git apply --index candidate/change.patch
          test "$(git write-tree)" = "$(cat candidate/tree.txt)"
          git -c user.name='ConversionX maintenance' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat: refine responsive workspace, report visuals and frontend interactions'
          git push origin HEAD:refs/heads/maintenance/frontend-verified-${{ github.run_id }}
          echo "VERIFIED_COMMIT=$(git rev-parse HEAD)"
