name: Vetting implementation verification
on:
  push:
    branches: ['maintenance/vetting-20260921']
permissions:
  contents: read
concurrency:
  group: vetting-20260921
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply and hash-check the vetting implementation
        run: |
          git merge-base --is-ancestor 5073c7d6b7b86ab054b2b200d2ad57cd1bc7b1a8 HEAD
          git apply .maintenance/vetting/edits.patch
          python .maintenance/vetting/check.py
      - run: npm ci --ignore-scripts --no-audit
      - run: node scripts/engine-stamp.cjs --check
      - run: npm run verify
      - name: Compile warehouse and validate existing publication gates
        run: |
          npm install --prefix tooling --ignore-scripts --no-audit
          mkdir -p verification
          tooling/node_modules/.bin/dataform compile warehouse --json > verification/dataform-graph.json
          node scripts/check-dataform-graph.cjs verification/dataform-graph.json
      - name: Desktop and mobile browser checks
        run: |
          tooling/node_modules/.bin/playwright install --with-deps chromium
          node tooling/browser/smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vetting-verification-${{ github.sha }}
          path: verification/
          retention-days: 7
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: verified-vetting-patch
          path: candidate/
          retention-days: 7
          if-no-files-found: error
  prepare-commit:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '5073c7d6b7b86ab054b2b200d2ad57cd1bc7b1a8'
      - uses: actions/download-artifact@v4
        with:
          name: verified-vetting-patch
          path: candidate
      - name: Commit the verified application on its feature branch
        run: |
          test "$(git rev-parse HEAD)" = '5073c7d6b7b86ab054b2b200d2ad57cd1bc7b1a8'
          git apply --index candidate/change.patch
          test "$(git write-tree)" = "$(cat candidate/tree.txt)"
          git -c user.name='ConversionX maintenance' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat: add in-depth class and colour vetting analysis'
          git push origin HEAD:refs/heads/feature/vetting-20260921
          echo "VERIFIED_COMMIT=$(git rev-parse HEAD)"
