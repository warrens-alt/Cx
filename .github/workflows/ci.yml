name: ConversionX CI
on:
  push:
    branches: [main, 'fix/audit-integrity-20260920']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cx-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked application source
        run: git archive --format=tar.gz --output=application-source.tar.gz HEAD -- src server scripts tests server.ts package.json package-lock.json tsconfig.json vite.config.ts index.html README.md .env.example .github
      - uses: actions/upload-artifact@v4
        with:
          name: application-source-${{ github.sha }}
          path: application-source.tar.gz
          retention-days: 7
          if-no-files-found: error
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      - run: npm run build
