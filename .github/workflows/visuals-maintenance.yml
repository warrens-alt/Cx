name: Interactive visuals verification
# Temporary preparation workflow; not included in the application commit or main.
on:
  push:
    branches: ['maintenance/visuals-20260921']
permissions:
  contents: read
concurrency:
  group: visuals-20260921
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply and hash-check the complete visualisation patch
        run: |
          git merge-base --is-ancestor a30d394c05da753617187cc17d2f41d46aff76a4 HEAD
          git apply --unidiff-zero .maintenance/visuals/0*.patch
          python .maintenance/visuals/check.py
      - run: npm ci --ignore-scripts --no-audit
      - run: node scripts/engine-stamp.cjs --check
      - run: npm run verify
      - name: Compile warehouse and validate assertion dependencies
        run: |
          npm install --prefix tooling --ignore-scripts --no-audit
          mkdir -p verification
          tooling/node_modules/.bin/dataform compile warehouse --json > verification/dataform-graph.json
          node scripts/check-dataform-graph.cjs verification/dataform-graph.json
      - name: Desktop and mobile browser checks
        run: |
          tooling/node_modules/.bin/playwright install --with-deps chromium
          node tooling/browser/smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visuals-verification-${{ github.sha }}
          path: verification/
          retention-days: 7
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: verified-visuals-patch
          path: candidate/
          retention-days: 7
          if-no-files-found: error
  prepare-commit:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'a30d394c05da753617187cc17d2f41d46aff76a4'
      - uses: actions/download-artifact@v4
        with:
          name: verified-visuals-patch
          path: candidate
      - name: Commit the verified application without changing main
        run: |
          test "$(git rev-parse HEAD)" = 'a30d394c05da753617187cc17d2f41d46aff76a4'
          git apply --index candidate/change.patch
          test "$(git write-tree)" = "$(cat candidate/tree.txt)"
          git -c user.name='ConversionX maintenance' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat: add adjustable visual views across application reports and tables'
          git push origin HEAD:refs/heads/maintenance/visuals-verified-20260921
          echo "VERIFIED_COMMIT=$(git rev-parse HEAD)"
